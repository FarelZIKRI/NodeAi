[build]
  command = "cd apps/backend && npm install --omit=dev && cd ../frontend && npm install --include=dev && npm run build"
  publish = "apps/frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "none"
  included_files = ["apps/backend/**"]

# Redirect semua /api/* ke Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback untuk React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
