[build]
  base = "apps/frontend"
  command = "cd ../.. && npm install --workspaces && npm run build --workspace=apps/frontend"
  publish = "dist"
  functions = "../../netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Redirect semua /api/* ke Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback untuk React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
